<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Angel Scripts</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    position: sticky;
    top: 0;
    z-index: 50;

    background: rgba(5, 5, 5, 0.96);
    backdrop-filter: blur(10px);

    border-bottom: 1px solid #222;
}

.header-inner {
    max-width: 1000px;
    margin: auto;

    min-height: 76px;
    padding: 12px 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 46px;
    height: 46px;

    border-radius: 50%;

    background: #f4bd00;
    color: black;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;
    font-weight: 900;
}

.brand-name {
    font-size: 22px;
    font-weight: 900;
}

.auth-button {
    background: #111;
    color: white;

    border: 1px solid #333;
    border-radius: 13px;

    padding: 12px 16px;

    font-weight: bold;
    cursor: pointer;
}

main {
    max-width: 1000px;
    margin: auto;
    padding: 45px 20px 100px;
}

.hero h1 {
    margin: 0;

    font-size: clamp(42px, 10vw, 75px);
    line-height: 0.95;
}

.hero p {
    color: #999;
    line-height: 1.6;
    font-size: 17px;

    max-width: 600px;
}

.search {
    width: 100%;

    margin-top: 25px;

    padding: 17px 18px;

    background: #101010;
    color: white;

    border: 1px solid #292929;
    border-radius: 15px;

    font-size: 16px;
    outline: none;
}

.search:focus {
    border-color: #f4bd00;
}

.section-title {
    margin-top: 45px;
    font-size: 27px;
}

#scripts {
    display: grid;
    gap: 20px;
}

.script-card {
    background: #0c0c0c;

    border: 1px solid #242424;
    border-radius: 22px;

    padding: 24px;
}

.script-title {
    font-size: 26px;
    margin: 0 0 8px;
}

.badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;

    margin-bottom: 16px;
}

.badge {
    display: inline-block;

    padding: 7px 10px;

    border-radius: 999px;

    background: #171717;
    border: 1px solid #292929;

    color: #aaa;

    font-size: 13px;
    font-weight: bold;
}

.public-badge {
    color: #f4bd00;
}

.private-badge {
    color: #aaa;
}

.code-box {
    background: #050505;

    border: 1px solid #222;
    border-radius: 15px;

    padding: 18px;

    overflow: auto;

    max-height: 360px;

    white-space: pre;

    font-family: monospace;
    font-size: 14px;
    line-height: 1.6;

    color: #ddd;
}

.card-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;

    margin-top: 18px;
}

.card-button {
    border: 0;

    min-height: 46px;
    padding: 12px 19px;

    border-radius: 12px;

    font-weight: 900;
    cursor: pointer;
}

.copy-button {
    background: #f4bd00;
    color: black;
}

.delete-button {
    background: #211010;
    color: #ff8e8e;

    border: 1px solid #532222;
}

.empty {
    color: #777;

    border: 1px dashed #292929;
    border-radius: 18px;

    padding: 35px 20px;

    text-align: center;
}

#adminPlus {
    display: none;

    position: fixed;

    right: 22px;
    bottom: 28px;

    width: 62px;
    height: 62px;

    border: 0;
    border-radius: 50%;

    background: #f4bd00;
    color: black;

    font-size: 36px;
    line-height: 1;

    font-weight: 400;

    cursor: pointer;

    box-shadow: 0 10px 35px rgba(0,0,0,.45);

    z-index: 80;
}

.overlay {
    display: none;

    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.8);

    z-index: 100;

    overflow-y: auto;

    padding: 30px 18px;
}

.overlay.open {
    display: block;
}

.creator {
    max-width: 700px;

    margin: auto;

    background: #0b0b0b;

    border: 1px solid #292929;
    border-radius: 24px;

    padding: 25px;
}

.creator-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.creator h2 {
    margin: 0;
    font-size: 28px;
}

.close-button {
    background: transparent;
    color: white;

    border: 1px solid #333;
    border-radius: 12px;

    width: 46px;
    height: 46px;

    font-size: 22px;

    cursor: pointer;
}

label {
    display: block;

    margin-top: 22px;
    margin-bottom: 8px;

    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;

    padding: 15px;

    background: #111;
    color: white;

    border: 1px solid #303030;
    border-radius: 13px;

    font-size: 16px;
    outline: none;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #f4bd00;
}

textarea {
    min-height: 310px;

    resize: vertical;

    font-family: monospace;
    line-height: 1.5;
}

.publish-button {
    width: 100%;

    margin-top: 22px;

    padding: 16px;

    border: 0;
    border-radius: 14px;

    background: #f4bd00;
    color: black;

    font-size: 17px;
    font-weight: 900;

    cursor: pointer;
}

.status {
    margin-top: 14px;

    min-height: 20px;

    color: #aaa;
}

.admin-text {
    color: #f4bd00;
    font-size: 13px;

    display: none;
}

footer {
    border-top: 1px solid #1c1c1c;

    text-align: center;

    color: #666;

    padding: 30px;
}

@media (max-width: 500px) {
    .brand-name {
        font-size: 18px;
    }

    .auth-button {
        padding: 10px 12px;
        font-size: 13px;
    }

    .script-card {
        padding: 18px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="brand">

            <div class="logo">
                A
            </div>

            <div>
                <div class="brand-name">
                    Angel Scripts
                </div>

                <div
                    id="adminText"
                    class="admin-text"
                >
                    Admin
                </div>
            </div>

        </div>

        <button
            id="authButton"
            class="auth-button"
        >
            Sign in
        </button>

    </div>
</header>


<main>

    <section class="hero">

        <h1>
            Angel<br>Scripts
        </h1>

        <p>
            Luau scripts for Roblox projects.
            Find a script and copy the code instantly.
        </p>

        <input
            id="search"
            class="search"
            placeholder="🔎 Search scripts..."
        >

    </section>


    <h2 class="section-title">
        Scripts
    </h2>

    <div id="scripts">

        <div class="empty">
            Loading scripts...
        </div>

    </div>

</main>


<button
    id="adminPlus"
    aria-label="Create script"
>
    +
</button>


<div
    id="creatorOverlay"
    class="overlay"
>

    <div class="creator">

        <div class="creator-top">

            <h2>
                Create Script
            </h2>

            <button
                id="closeCreator"
                class="close-button"
            >
                ×
            </button>

        </div>


        <label for="scriptTitle">
            Script title
        </label>

        <input
            id="scriptTitle"
            maxlength="100"
            placeholder="Example: Dynamic Weather System"
        >


        <label for="scriptVisibility">
            Visibility
        </label>

        <select id="scriptVisibility">

            <option value="public">
                Public
            </option>

            <option value="private">
                Private
            </option>

        </select>


        <label for="scriptCode">
            Luau code
        </label>

        <textarea
            id="scriptCode"
            spellcheck="false"
            placeholder='local Players = game:GetService("Players")'
        ></textarea>


        <button
            id="publishButton"
            class="publish-button"
        >
            Publish Script
        </button>


        <div
            id="publishStatus"
            class="status"
        ></div>

    </div>

</div>


<footer>
    © 2026 Angel Scripts
</footer>


<script type="module">

/*
=================================================
STEP 1

PASTE YOUR FIREBASE CONFIG VALUES BELOW.

Go to:

Firebase
→ Project Settings
→ Your apps
→ Angel Scripts web app
→ SDK setup and configuration

You only replace the values inside quotation marks.
=================================================
*/


const firebaseConfig = {

    apiKey: "PASTE_YOUR_API_KEY",

    authDomain: "PASTE_YOUR_AUTH_DOMAIN",

    projectId: "PASTE_YOUR_PROJECT_ID",

    storageBucket: "PASTE_YOUR_STORAGE_BUCKET",

    messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",

    appId: "PASTE_YOUR_APP_ID"

};


/*
=================================================
You normally do NOT need to edit anything
under this line.
=================================================
*/


import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signInWithRedirect,
    getRedirectResult,
    signOut,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    serverTimestamp,
    query,
    where,
    orderBy,
    onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);

const provider =
    new GoogleAuthProvider();


const ADMIN_EMAIL =
    "Qodukogbe@gmail.com";


const authButton =
    document.getElementById("authButton");

const adminPlus =
    document.getElementById("adminPlus");

const adminText =
    document.getElementById("adminText");

const creatorOverlay =
    document.getElementById("creatorOverlay");

const closeCreator =
    document.getElementById("closeCreator");

const titleInput =
    document.getElementById("scriptTitle");

const visibilityInput =
    document.getElementById("scriptVisibility");

const codeInput =
    document.getElementById("scriptCode");

const publishButton =
    document.getElementById("publishButton");

const publishStatus =
    document.getElementById("publishStatus");

const scriptsContainer =
    document.getElementById("scripts");

const searchInput =
    document.getElementById("search");


let currentUser = null;
let scripts = [];
let unsubscribeScripts = null;


/*
=============================
ADMIN CHECK
=============================
*/

function isAdmin(user) {

    if (!user) {
        return false;
    }

    return (
        user.emailVerified === true &&
        user.email?.toLowerCase()
        === ADMIN_EMAIL.toLowerCase()
    );

}


/*
=============================
AUTHENTICATION
=============================
*/

authButton.addEventListener(
    "click",
    async function () {

        if (currentUser) {

            try {

                await signOut(auth);

            } catch (error) {

                alert(
                    "Sign out failed: " +
                    error.message
                );

            }

            return;
        }


        try {

            /*
            Try popup first.
            Works well on most browsers.
            */

            await signInWithPopup(
                auth,
                provider
            );

        } catch (error) {

            /*
            Some mobile browsers block popups.
            Redirect is the backup.
            */

            if (
                error.code ===
                "auth/popup-blocked"
                ||
                error.code ===
                "auth/cancelled-popup-request"
                ||
                error.code ===
                "auth/operation-not-supported-in-this-environment"
            ) {

                await signInWithRedirect(
                    auth,
                    provider
                );

                return;
            }


            alert(
                "Sign in failed: " +
                error.message
            );

        }

    }
);


/*
Handle return from redirect sign-in.
*/

try {

    await getRedirectResult(auth);

} catch (error) {

    console.error(
        "Redirect sign-in error:",
        error
    );

}


/*
Watch login status.
*/

onAuthStateChanged(
    auth,
    function (user) {

        currentUser = user;


        if (!user) {

            authButton.textContent =
                "Sign in";

            adminPlus.style.display =
                "none";

            adminText.style.display =
                "none";

            closeCreatorPanel();

            startScriptListener();

            return;
        }


        authButton.textContent =
            "Sign out";


        if (isAdmin(user)) {

            adminPlus.style.display =
                "block";

            adminText.style.display =
                "block";

        } else {

            adminPlus.style.display =
                "none";

            adminText.style.display =
                "none";

        }


        startScriptListener();

    }
);


/*
=============================
CREATE SCRIPT PANEL
=============================
*/

adminPlus.addEventListener(
    "click",
    function () {

        if (!isAdmin(currentUser)) {
            return;
        }

        creatorOverlay.classList.add(
            "open"
        );

    }
);


closeCreator.addEventListener(
    "click",
    closeCreatorPanel
);


creatorOverlay.addEventListener(
    "click",
    function (event) {

        if (
            event.target ===
            creatorOverlay
        ) {

            closeCreatorPanel();

        }

    }
);


function closeCreatorPanel() {

    creatorOverlay.classList.remove(
        "open"
    );

}


/*
=============================
PUBLISH SCRIPT
=============================
*/

publishButton.addEventListener(
    "click",
    async function () {

        if (!isAdmin(currentUser)) {

            publishStatus.textContent =
                "You do not have permission to publish.";

            return;
        }


        const title =
            titleInput.value.trim();

        const visibility =
            visibilityInput.value;

        const code =
            codeInput.value.trim();


        if (!title) {

            publishStatus.textContent =
                "Enter a script title.";

            return;
        }


        if (!code) {

            publishStatus.textContent =
                "Paste your Luau code.";

            return;
        }


        publishButton.disabled = true;

        publishButton.textContent =
            "Publishing...";

        publishStatus.textContent =
            "";


        try {

            await addDoc(
                collection(
                    db,
                    "scripts"
                ),
                {

                    title: title,

                    visibility:
                        visibility,

                    code: code,

                    createdAt:
                        serverTimestamp()

                }
            );


            titleInput.value = "";

            codeInput.value = "";

            visibilityInput.value =
                "public";


            publishStatus.textContent =
                "✓ Script published!";


            setTimeout(
                function () {

                    closeCreatorPanel();

                    publishStatus.textContent =
                        "";

                },
                900
            );


        } catch (error) {

            console.error(error);

            publishStatus.textContent =
                "Publish failed: " +
                error.message;

        } finally {

            publishButton.disabled =
                false;

            publishButton.textContent =
                "Publish Script";

        }

    }
);


/*
=============================
LOAD SCRIPTS
=============================
*/

function startScriptListener() {

    if (unsubscribeScripts) {

        unsubscribeScripts();

        unsubscribeScripts = null;

    }


    let scriptsQuery;


    if (isAdmin(currentUser)) {

        /*
        Admin sees public + private.
        */

        scriptsQuery =
            query(
                collection(
                    db,
                    "scripts"
                ),
                orderBy(
                    "createdAt",
                    "desc"
                )
            );

    } else {

        /*
        Everyone else only requests
        PUBLIC scripts.
        */

        scriptsQuery =
            query(
                collection(
                    db,
                    "scripts"
                ),
                where(
                    "visibility",
                    "==",
                    "public"
                )
            );

    }


    unsubscribeScripts =
        onSnapshot(
            scriptsQuery,

            function (snapshot) {

                scripts = [];


                snapshot.forEach(
                    function (documentSnapshot) {

                        scripts.push({
                            id:
                                documentSnapshot.id,

                            ...documentSnapshot.data()
                        });

                    }
                );


                /*
                Public query does not
                necessarily return newest first,
                so sort in JavaScript.
                */

                scripts.sort(
                    function (a, b) {

                        const timeA =
                            a.createdAt?.seconds
                            || 0;

                        const timeB =
                            b.createdAt?.seconds
                            || 0;

                        return timeB - timeA;

                    }
                );


                renderScripts();

            },

            function (error) {

                console.error(error);

                scriptsContainer.innerHTML =
                    `
                    <div class="empty">
                        Couldn't load scripts.<br><br>
                        ${escapeHtml(error.message)}
                    </div>
                    `;

            }
        );

}


/*
=============================
DISPLAY SCRIPTS
=============================
*/

function renderScripts() {

    const search =
        searchInput.value
        .trim()
        .toLowerCase();


    const filtered =
        scripts.filter(
            function (script) {

                return (
                    script.title
                    || ""
                )
                .toLowerCase()
                .includes(search);

            }
        );


    if (filtered.length === 0) {

        scriptsContainer.innerHTML =
            `
            <div class="empty">
                No scripts found.
            </div>
            `;

        return;
    }


    scriptsContainer.innerHTML = "";


    filtered.forEach(
        function (script) {

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "script-card";


            const safeTitle =
                escapeHtml(
                    script.title
                    || "Untitled Script"
                );


            const safeVisibility =
                script.visibility
                === "private"
                ? "private"
                : "public";


            card.innerHTML =
                `
                <h2 class="script-title">
                    ${safeTitle}
                </h2>

                <div class="badges">

                    <span class="badge">
                        Luau
                    </span>

                    <span
                        class="badge
                        ${
                            safeVisibility ===
                            "public"
                            ?
                            "public-badge"
                            :
                            "private-badge"
                        }"
                    >
                        ${
                            safeVisibility ===
                            "public"
                            ?
                            "Public"
                            :
                            "Private"
                        }
                    </span>

                </div>

                <pre class="code-box"><code></code></pre>

                <div class="card-buttons">

                    <button
                        class="card-button copy-button"
                    >
                        📋 COPY SCRIPT
                    </button>

                    ${
                        isAdmin(currentUser)
                        ?
                        `
                        <button
                            class="card-button delete-button"
                        >
                            Delete
                        </button>
                        `
                        :
                        ""
                    }

                </div>
                `;


            const codeElement =
                card.querySelector(
                    "code"
                );


            codeElement.textContent =
                script.code || "";


            const copyButton =
                card.querySelector(
                    ".copy-button"
                );


            copyButton.addEventListener(
                "click",
                async function () {

                    await copyScript(
                        script.code || "",
                        copyButton
                    );

                }
            );


            const deleteButton =
                card.querySelector(
                    ".delete-button"
                );


            if (deleteButton) {

                deleteButton.addEventListener(
                    "click",
                    async function () {

                        await deleteScript(
                            script
                        );

                    }
                );

            }


            scriptsContainer.appendChild(
                card
            );

        }
    );

}


/*
=============================
COPY SCRIPT
=============================
*/

async function copyScript(
    code,
    button
) {

    const oldText =
        button.textContent;


    try {

        await navigator.clipboard.writeText(
            code
        );

        button.textContent =
            "✓ COPIED!";


        setTimeout(
            function () {

                button.textContent =
                    oldText;

            },
            1400
        );


    } catch (error) {

        /*
        Backup copy method.
        */

        const textarea =
            document.createElement(
                "textarea"
            );

        textarea.value = code;

        textarea.style.position =
            "fixed";

        textarea.style.opacity =
            "0";

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand(
            "copy"
        );

        textarea.remove();


        button.textContent =
            "✓ COPIED!";


        setTimeout(
            function () {

                button.textContent =
                    oldText;

            },
            1400
        );

    }

}


/*
=============================
DELETE SCRIPT
=============================
*/

async function deleteScript(script) {

    if (!isAdmin(currentUser)) {
        return;
    }


    const confirmed =
        confirm(
            'Delete "' +
            script.title +
            '"?'
        );


    if (!confirmed) {
        return;
    }


    try {

        await deleteDoc(
            doc(
                db,
                "scripts",
                script.id
            )
        );

    } catch (error) {

        alert(
            "Delete failed: " +
            error.message
        );

    }

}


/*
=============================
SEARCH
=============================
*/

searchInput.addEventListener(
    "input",
    renderScripts
);


/*
=============================
SAFE HTML
=============================
*/

function escapeHtml(text) {

    return String(text)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}

</script>

</body>
</html>
